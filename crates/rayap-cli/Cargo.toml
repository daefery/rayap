[package]
name = "rayap-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line for rayap, a polite, restartable web crawl engine"

[[bin]]
name = "rayap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rayap-core = { version = "0.1.0", path = "../rayap-core" }
rayap-serve = { version = "0.1.0", path = "../rayap-serve" }
axum = "0.8.9"
base64 = "0.23.1"
url = "2.5.8"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
