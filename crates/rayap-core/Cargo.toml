[package]
name = "rayap-core"
version = "0.1.0"
description = "A polite, restartable web crawl engine"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.9"
sha2 = "0.11.1"
httpdate = "1.0.3"
lol_html = "3.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "rt", "net", "process"] }
toml = "1.2.0"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
