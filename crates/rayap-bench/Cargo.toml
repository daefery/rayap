[package]
name = "rayap-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
pprof = { version = "0.15.0", features = ["flamegraph"] }
rayap-core = { version = "0.1.0", path = "../rayap-core" }
rayap-sim = { version = "0.1.0", path = "../rayap-sim" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
