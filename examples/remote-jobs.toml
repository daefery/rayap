# Remote-job aggregator feeds published for redistribution (each asks for attribution and a
# link back to the listing; both are in every record). Each job is marked `eligible_from`
# a configured country by a stated rule against the board's own location text and the
# posting body; the record says which rule fired. Crawl output stays local.

[crawler]
contact = "https://github.com/daefery/rayap"
per_host_delay_ms = 3000

[[source]]
name = "himalayas"
url = "https://himalayas.app/jobs/api?limit=20"
kind = "jobs"
country = "Indonesia"
max_jobs = 400          # 20 per page, cursor-paged; newest first

# Remotive's API notice invites reuse with attribution, but its robots.txt disallows /api/*
# for every crawler, so rayap blocks it (checked 8 Nov 2026). Not included.

[[source]]
name = "remoteok"
url = "https://remoteok.com/api"
kind = "jobs"
country = "Indonesia"   # one page, ~100 newest
