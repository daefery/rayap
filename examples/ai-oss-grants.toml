# Public pages of funders that give grants to AI and open-source projects (7 Nov 2026).
# Funders' own pages, not aggregators: these are where a deadline or a new call appears first.
# Public pages only; rayap never logs in. LinkedIn is not here: its robots.txt disallows
# everything for every crawler but LinkedInBot and the search engines it whitelists.

[crawler]
contact = "https://github.com/daefery/rayap"
per_host_delay_ms = 5000

# Open source infrastructure and maintainers
[[source]]
name = "sovereign-tech-programs"
url = "https://www.sovereign.tech/programs"

